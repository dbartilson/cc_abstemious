[package]
name = "cc_abstemious"
version = "1.4.7"
edition = "2024"

[lib]
name = "cc_abstemious"
path = "src/lib.rs"

[profile.release]
debug = true

[[bin]]
name = "cc_abstemious"
path = "src/main.rs"

[[test]]
name = "cc_abstemious_verification"
path = "src/tests/verification.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
approx = "0.5.1"
csv = "1.4.0"
log = "0.4.33"
nalgebra = "0.35.0"
rand = "0.10.2"
rayon = "1.12.0"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
simplelog = "0.12.2"
